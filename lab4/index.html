<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        label {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Student card FORM</h1>
    </header>
    <main>
        <section>
            <form action="." method="post">
                <h2>Personal Information</h2>
                <fieldset>
                    <legend>Your details</legend>
                    <label for="fullname">Full Name</label><input type="text" id="fullname" name="fullname">
                    <label for="email">Email</label><input type="email" id="email" name="email">
                    <label for="password">Password</label><input type="password" id="password" name="password">
                    <label for="age">Age</label><input type="number" id="age" name="age">
                    <label for="dob">Date of Birth</label><input type="date" id="dob" name="dob">
                    <label>Gender</label><input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label> <input type="radio" id="female" name="gender" value="female"> <label
                        for="female">Female</label> <input type="radio" id="other" name="gender" value="other"> <label
                        for="other">Other</label>

                    <label for="languages">Languages Known</label>
                    <input type="checkbox" id="english" name="languages" value="english">
                    <label for="english">English</label>
                    <input type="checkbox" id="spanish" name="languages" value="spanish">
                    <label for="spanish">Spanish</label>
                    <input type="checkbox" id="french" name="languages" value="french">
                    <label for="french">French</label>
                    <select name="country" id="country">
                        <option>United States</option>
                        <option>Canada</option>
                        <option>Mexico</option>
                    </select>
                </fieldset>
                <h2>College Subjects</h2>
                <fieldset>
                    <legend>Your details</legend>

                </fieldset>
            </form>
        </section>
    </main>

</body>

</html>
