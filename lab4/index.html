<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Student card FORM</h1>
    </header>
    <section>
        <h2><b>Personal Information</b></h2>
        <fieldset>
            <legend>Details</legend>
            Full Name:<input type="text">
        </fieldset>
        Email:<input type="email">
        <fieldset>
            <legend>Contact</legend>
            Phone Number: <input type="tel">
        </fieldset>
        Password:<input type="password">
        </section>
        <section>
           Age:<input type="number">
        </section>
        <section>
            Date of Birth:<input type="date">
        </section>
        <section>
            Gender:<input type="radio">  Male, <input type="radio">  Female, <input type="radio">  Other
        </section>
        <section>
            Languages Known: <input type="checkbox">English, <input type="checkbox">Spanish, <input type="checkbox">French
        </section>
        Country: <select>
            <option>United States</option>
            <option>Canada</option>
            <option>Mexico</option>
        </select>
        <section>Multi-select Box <select multiple> - College Subjects (Mathematics,
                Computer Science, Physics, Chemistry, English)</section>
        <section>Range Slider <input type="range"> - Rate Interest in Computer
            Science</section>
        <section>Textarea (<textarea>) - Describe Skills</section>
           <section></section>File Upload <input type="file"> - Upload Resume</section>
           <section>Color Picker <input type="color"> - Pick Favorite Color</section>
           <section>Time Picker <input type="time"> - Preferred Study Time</section>

Submit Button <input type="submit"> - Submit Survey
</body>
</html>
